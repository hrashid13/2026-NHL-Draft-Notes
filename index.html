<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 NHL Draft Interactive Scout Board</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #ffffff;
    --bg-secondary: #f5f5f5;
    --bg-card: #ffffff;
    --text: #111111;
    --text-secondary: #555555;
    --text-muted: #888888;
    --border: #e0e0e0;
    --border-hover: #aaaaaa;
    --radius-sm: 6px;
    --radius-md: 8px;
    --radius-lg: 12px;
    --blue-bg: #E6F1FB; --blue-text: #0C447C;
    --purple-bg: #EEEDFE; --purple-text: #3C3489;
    --amber-bg: #FAEEDA; --amber-text: #633806;
    --red-bg: #FCEBEB; --red-text: #791F1F;
    --green-bg: #EAF3DE; --green-text: #27500A;
    --gray-bg: #f0f0f0; --gray-text: #555555;
  }

  body {
    font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
    background: var(--bg-secondary);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
  }

  header {
    background: #0a1628;
    color: #ffffff;
    padding: 20px 28px 16px;
    border-bottom: 3px solid #1e5fa8;
  }

  header h1 {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin-bottom: 2px;
  }

  header p {
    font-size: 12px;
    color: #8aaacf;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .toolbar {
    background: #ffffff;
    border-bottom: 1px solid var(--border);
    padding: 12px 28px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .toolbar input[type="search"] {
    flex: 1;
    min-width: 180px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-family: inherit;
    background: var(--bg);
    color: var(--text);
    outline: none;
  }
  .toolbar input[type="search"]:focus { border-color: #1e5fa8; box-shadow: 0 0 0 2px rgba(30,95,168,0.15); }

  .toolbar select {
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-family: inherit;
    background: var(--bg);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .toolbar select:focus { border-color: #1e5fa8; }

  .stats-bar {
    padding: 10px 28px;
    display: flex;
    gap: 20px;
    font-size: 12px;
    color: var(--text-muted);
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
  }
  .stats-bar strong { color: var(--text); font-size: 16px; font-weight: 600; margin-right: 3px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
    gap: 12px;
    padding: 20px 28px;
    max-width: 1600px;
  }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 14px 16px;
    cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .card:hover { border-color: var(--border-hover); box-shadow: 0 2px 8px rgba(0,0,0,0.07); }
  .card.expanded { border-color: #1e5fa8; box-shadow: 0 0 0 1px #1e5fa8; }

  .card-header { display: flex; align-items: flex-start; gap: 12px; }

  .rank {
    font-size: 26px;
    font-weight: 700;
    color: #d0d0d0;
    min-width: 36px;
    line-height: 1;
    padding-top: 2px;
  }
  .rank.top6 { color: #c0392b; }
  .rank.top15 { color: #e67e22; }
  .rank.top30 { color: #1e5fa8; }

  .prospect-info { flex: 1; min-width: 0; }

  .name { font-size: 15px; font-weight: 600; color: var(--text); line-height: 1.2; }

  .meta { font-size: 12px; color: var(--text-secondary); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .badges { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }

  .badge {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 4px;
  }
  .b-F { background: var(--blue-bg); color: var(--blue-text); }
  .b-D { background: var(--purple-bg); color: var(--purple-text); }
  .b-hand { background: var(--gray-bg); color: var(--gray-text); }
  .b-league { background: var(--amber-bg); color: var(--amber-text); }
  .b-t1 { background: var(--red-bg); color: var(--red-text); }
  .b-t2 { background: var(--amber-bg); color: var(--amber-text); }
  .b-t3 { background: var(--blue-bg); color: var(--blue-text); }
  .b-t4 { background: var(--gray-bg); color: var(--gray-text); }

  .comp { font-size: 12px; color: var(--text-muted); font-style: italic; margin-top: 6px; }
  .comp strong { color: var(--text-secondary); font-style: normal; font-weight: 600; }

  .toggle-btn {
    display: inline-block;
    margin-top: 10px;
    font-size: 11px;
    color: #1e5fa8;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    font-family: inherit;
    text-decoration: none;
    border-bottom: 1px dashed #1e5fa8;
  }

  .details {
    display: none;
    margin-top: 14px;
    border-top: 1px solid var(--border);
    padding-top: 14px;
  }
  .card.expanded .details { display: block; }

  .section { margin-bottom: 12px; }

  .section-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    margin-bottom: 5px;
  }

  .section-text { font-size: 13px; color: var(--text-secondary); line-height: 1.55; }

  .bottom-line {
    font-size: 13px;
    color: var(--text);
    line-height: 1.55;
    font-style: italic;
    background: #f0f6ff;
    border-left: 3px solid #1e5fa8;
    padding: 8px 12px;
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  }

  .sources { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }

  .src-link {
    font-size: 11px;
    color: #1e5fa8;
    text-decoration: none;
    padding: 2px 8px;
    border: 1px solid #b0cde8;
    border-radius: 4px;
    background: #f0f6ff;
  }
  .src-link:hover { background: #dceeff; }

  .empty { text-align: center; padding: 4rem; color: var(--text-muted); font-size: 14px; grid-column: 1/-1; }

  @media (max-width: 600px) {
    header, .toolbar, .stats-bar, .grid { padding-left: 14px; padding-right: 14px; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>

const tierClass = r => r<=6?'b-t1':r<=15?'b-t2':r<=30?'b-t3':'b-t4';
const tierLabel = r => r<=6?'Tier 1':r<=15?'Tier 2':r<=30?'Tier 3':'Tier 4';
const rankClass = r => r<=6?'top6':r<=15?'top15':r<=30?'top30':'';

function render() {
  const q = (document.getElementById('search').value || '').toLowerCase();
  const pos = document.getElementById('posFilter').value;
  const hand = document.getElementById('handFilter').value;
  const league = document.getElementById('leagueFilter').value;
  const tier = document.getElementById('tierFilter').value;

  const filtered = prospects.filter(p => {
    if (q && !p.name.toLowerCase().includes(q) && !p.team.toLowerCase().includes(q) && !(p.comp||'').toLowerCase().includes(q) && !p.posRaw.toLowerCase().includes(q)) return false;
    if (pos && p.pos !== pos) return false;
    if (hand && p.hand !== hand) return false;
    if (league && p.league !== league) return false;
    if (tier) {
      const t = parseInt(tier);
      if (t===1 && p.rank>6) return false;
      if (t===2 && (p.rank<7||p.rank>15)) return false;
      if (t===3 && (p.rank<16||p.rank>30)) return false;
      if (t===4 && p.rank<31) return false;
    }
    return true;
  });

  document.getElementById('s-total').textContent = filtered.length;
  document.getElementById('s-f').textContent = filtered.filter(p=>p.pos==='F').length;
  document.getElementById('s-d').textContent = filtered.filter(p=>p.pos==='D').length;

  const grid = document.getElementById('grid');
  if (!filtered.length) {
    grid.innerHTML = '<div class="empty">No prospects match your filters.</div>';
    return;
  }

  grid.innerHTML = filtered.map(p => {
    const id = 'card-' + p.rank;
    const srcHtml = p.sources.map(([name, url]) => `<a class="src-link" href="${url}" target="_blank">${name}</a>`).join('');
    const compHtml = p.comp ? `<div class="comp">Comp: <strong>${p.comp}</strong></div>` : '';
    const headlineHtml = p.headline ? `<div style="font-size:12px;color:#444;font-style:italic;margin-top:5px;line-height:1.4">${p.headline}</div>` : '';
    return `<div class="card" id="${id}" onclick="toggle('${id}')">
  <div class="card-header">
    <div class="rank ${rankClass(p.rank)}">${p.rank}</div>
    <div class="prospect-info">
      <div class="name">${p.name}</div>
      <div class="meta">${p.posRaw} · ${p.team}${p.size ? ' · ' + p.size : ''}</div>
      <div class="badges">
        <span class="badge b-${p.pos}">${p.posRaw}</span>
        <span class="badge b-hand">${p.hand==='L'?'Left shot':'Right shot'}</span>
        <span class="badge b-league">${p.league}</span>
        <span class="badge ${tierClass(p.rank)}">${tierLabel(p.rank)}</span>
      </div>
      ${compHtml}
      ${headlineHtml}
    </div>
  </div>
  <button class="toggle-btn">▾ full report</button>
  <div class="details">
    <div class="section">
      <div class="section-label">Strengths</div>
      <div class="section-text">${p.strengths}</div>
    </div>
    <div class="section">
      <div class="section-label">Weaknesses</div>
      <div class="section-text">${p.weaknesses}</div>
    </div>
    <div class="section">
      <div class="section-label">Bottom line</div>
      <div class="bottom-line">${p.bottom}</div>
    </div>
    <div class="sources">${srcHtml}</div>
  </div>
</div>`;
  }).join('');
}

function toggle(id) {
  document.getElementById(id).classList.toggle('expanded');
}

render();
</script>
